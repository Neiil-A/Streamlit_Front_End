# Theme for Stop Looking at my Computer News (press/app.py): cool white, navy and steel blue.
[theme]
base = "light"
primaryColor = "#1d4f91"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#e9eef5"
textColor = "#0b1b33"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501
enableStaticServing = true
